name: Whole setup

# The whole of Secretli as production runs it, with both clients: the stack
# (stack/), the gateway's routing, the command-line journeys
# (cli/journeys.sh), and the command-line client together with the browser
# (browser/). Only the latest client release is supported, so only it runs.
#
# Runs here on every change and nightly, against everything at main. The
# component repositories call it with their own change in place of one
# published part, for example:
#
#   whole-setup:
#     uses: secretli/e2e/.github/workflows/whole-setup.yml@main
#     secrets: inherit
#     with:
#       server_ref: ${{ github.event.pull_request.head.sha || github.sha }}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      server_ref:
        description: Build secretli/server at this ref instead of using its published image
        type: string
        default: ""
      web_ref:
        description: Build secretli/web at this ref instead of using its published image
        type: string
        default: ""
      cli_ref:
        description: Build secretli/cli at this ref instead of using its latest release
        type: string
        default: ""
  workflow_call:
    inputs:
      server_ref:
        type: string
        default: ""
      web_ref:
        type: string
        default: ""
      cli_ref:
        type: string
        default: ""
    # Callers pass it with `secrets: inherit`; without it, images are pulled
    # anonymously.
    secrets:
      DOCKERHUB_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  whole-setup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SERVER_REF: ${{ inputs.server_ref }}
      WEB_REF: ${{ inputs.web_ref }}
      CLI_REF: ${{ inputs.cli_ref }}
      DOCKERHUB_LOGIN: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      # Called from another repository, this workflow still needs its own
      # files: the stack, the journeys and the browser tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: secretli/e2e
          ref: ${{ github.repository == 'secretli/e2e' && github.ref || 'main' }}
          persist-credentials: false

      # Docker Hub limits anonymous pulls from shared runners, so pulls are
      # made as the organisation's read-only Docker Hub user, whenever the
      # caller passed the token on.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_LOGIN == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check out the server under test
        if: env.SERVER_REF != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: secretli/server
          ref: ${{ env.SERVER_REF }}
          path: _build/server
          persist-credentials: false

      - name: Build the server under test
        if: env.SERVER_REF != ''
        run: |
          docker build -t secretli-server:under-test _build/server
          echo "SERVER_IMAGE=secretli-server:under-test" >> "$GITHUB_ENV"

      - name: Check out the web app under test
        if: env.WEB_REF != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: secretli/web
          ref: ${{ env.WEB_REF }}
          path: _build/web
          persist-credentials: false

      - name: Build the web app under test
        if: env.WEB_REF != ''
        run: |
          docker build --build-arg VERSION="$(git -C _build/web rev-parse HEAD)" -t secretli-web:under-test _build/web
          echo "WEB_IMAGE=secretli-web:under-test" >> "$GITHUB_ENV"

      - name: Check out the client under test
        if: env.CLI_REF != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: secretli/cli
          ref: ${{ env.CLI_REF }}
          path: _build/cli
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Install the client
        # setup-go's "stable" can trail a fresh Go release for hours, and a
        # client built at a ref may already require it: let go fetch the
        # toolchain the client's go.mod asks for.
        env:
          GOTOOLCHAIN: auto
        run: |
          # The module proxy now and then drops a download; try again.
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "attempt $attempt failed: $*" >&2
              sleep $((attempt * 5))
            done
            return 1
          }
          mkdir -p "$RUNNER_TEMP/bin"
          if [ -n "$CLI_REF" ]; then
            (cd _build/cli && retry go build -o "$RUNNER_TEMP/bin/secretli" ./cmd/secretli)
          else
            retry env GOBIN="$RUNNER_TEMP/bin" go install github.com/secretli/cli/cmd/secretli@latest
          fi
          "$RUNNER_TEMP/bin/secretli" --version

      - name: Start the stack
        run: stack/stack.sh up

      - name: Routing
        run: stack/routing-checks.sh

      - name: Command-line journeys
        run: SECRETLI_CLI="$RUNNER_TEMP/bin/secretli" cli/journeys.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: browser/package.json
          run_install: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: browser/pnpm-lock.yaml

      - name: Install the browser tests
        working-directory: browser
        timeout-minutes: 10
        run: |
          pnpm install --frozen-lockfile
          # Without --with-deps: the runner image already has the libraries
          # Chromium needs, and apt-get update can hang on a stalled mirror.
          pnpm exec playwright install chromium

      - name: The client and the browser together
        working-directory: browser
        run: SECRETLI_CLI="$RUNNER_TEMP/bin/secretli" pnpm test

      - name: Logs
        if: failure()
        run: stack/stack.sh logs

      - name: Stop the stack
        if: always()
        run: stack/stack.sh down || true
