name: Smoke

# Checks a deployed Secretli from the outside (smoke/smoke.sh): after every
# deploy, every hour and on demand. Health, the version and the gateway's
# routing, and it shares and opens a test secret that expires after five
# minutes and hands a link over with a code. create_secrets: false checks
# without writing.
#
# Deploys are announced by Flux (pscheid92/k8s, apps/secretli/
# deploy-notifications.yaml) as repository_dispatch events about its
# secretli Kustomization: "Health check passed" once a deploy is rolled out
# and healthy, what it deleted for a deploy that only deletes something, and
# errors when one fails, which fail a run here. A deploy that changes and
# deletes things is announced twice, deletions first; the later run cancels
# the earlier one, so each deploy ends with one run for its final state.

run-name: ${{ github.event_name == 'repository_dispatch' && format('After deploy of {0}', github.event.client_payload.metadata.revision) || 'Smoke' }}

on:
  repository_dispatch:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      url:
        description: The Secretli to check
        type: string
        default: https://secretli.app
      create_secrets:
        description: Also share, open and hand over short-lived test secrets
        type: boolean
        default: true
  workflow_call:
    inputs:
      url:
        type: string
        default: https://secretli.app
      create_secrets:
        type: boolean
        default: true

# One run per announced revision: a later announcement of the same revision
# cancels the run before it. Runs started otherwise never cancel each other.
concurrency:
  group: smoke-${{ github.event.client_payload.metadata.revision || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Flux reported a failed deploy of Secretli: fail, so it is noticed.
  deploy-failed:
    if: github.event_name == 'repository_dispatch' && github.event.client_payload.involvedObject.name == 'secretli' && github.event.client_payload.severity == 'error'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the failed deploy
        env:
          REASON: ${{ github.event.client_payload.reason }}
          MESSAGE: ${{ github.event.client_payload.message }}
          REVISION: ${{ github.event.client_payload.metadata.revision }}
        run: |
          echo "::error title=Secretli deploy failed (${REASON})::${MESSAGE}"
          echo "revision: ${REVISION}"
          exit 1

  smoke:
    if: github.event_name != 'repository_dispatch' || (github.event.client_payload.involvedObject.name == 'secretli' && github.event.client_payload.severity == 'info')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # A schedule or a deploy has no inputs: the defaults apply.
      SMOKE_URL: ${{ inputs.url || 'https://secretli.app' }}
      SMOKE_CREATE_SECRETS: ${{ (github.event_name == 'schedule' || github.event_name == 'repository_dispatch' || inputs.create_secrets) && '1' || '' }}
    steps:
      - name: The deploy
        if: github.event_name == 'repository_dispatch'
        env:
          MESSAGE: ${{ github.event.client_payload.message }}
          REVISION: ${{ github.event.client_payload.metadata.revision }}
        run: |
          echo "Flux: ${MESSAGE}"
          echo "k8s revision: ${REVISION}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: secretli/e2e
          ref: ${{ github.repository == 'secretli/e2e' && github.ref || 'main' }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: env.SMOKE_CREATE_SECRETS == '1'
        with:
          go-version: stable
          cache: false

      - name: Install the client
        if: env.SMOKE_CREATE_SECRETS == '1'
        run: |
          # The module proxy now and then drops a download; try again.
          for attempt in 1 2 3; do
            GOBIN="$RUNNER_TEMP/bin" go install github.com/secretli/cli/cmd/secretli@latest && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Smoke
        run: SECRETLI_CLI="$RUNNER_TEMP/bin/secretli" smoke/smoke.sh
